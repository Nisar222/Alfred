name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conflict-markers:
    name: No unresolved merge conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for conflict markers
        run: |
          # A commit that reaches main with unresolved <<<<<<<  /=======/ >>>>>>> markers
          # can break the served frontend or backend outright (see incident 2026-08-13:
          # a23ecf6 shipped with markers in app.js and broke the whole dashboard).
          # This must run before build/deploy on every push and PR.
          if grep -RIn --exclude-dir=.git -E '^(<{7}|={7}|>{7}) ?' -- backend docker-compose.yml; then
            echo "::error::Unresolved merge-conflict markers found. Resolve before merging."
            exit 1
          fi
          echo "No conflict markers found."

  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    needs: conflict-markers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run test suite
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -v
      - name: Syntax-check frontend JS
        run: node --check backend/app/web/app.js
      - name: Syntax-check ops shell scripts
        run: |
          bash -n ops/backup-postgres.sh
          bash -n ops/restore-postgres.sh

# GHCR build-and-push job removed 2026-08-14: it failed on every run because
# this repo's Actions workflow permissions don't currently allow package
# writes (Settings -> Actions -> General -> Workflow permissions -> "Read and
# write permissions" — needs a GitHub admin, not available from CI itself).
# Re-add once that's confirmed, then switch alfred-vps.sh back to `deploy`
# (pull GHCR image) instead of `deploy-local-build`. Until then the
# conflict-marker check and test suite above are the active safety net, and
# deploys build the image on the VPS directly.
