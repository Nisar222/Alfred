services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jamal_dialler}
      POSTGRES_USER: ${POSTGRES_USER:-jamal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true

  api:
    # CI builds and pushes this image from a tested `main` commit (see
    # .github/workflows/ci.yml). Deploy with `docker compose pull && docker
    # compose up -d` to run that known-good image. `image:` + `build:`
    # together also let `docker compose up --build` still work for local
    # development without registry access (see README).
    image: ${ALFRED_API_IMAGE:-ghcr.io/nisar222/alfred-api:latest}
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jamal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jamal_dialler}
      REDIS_URL: redis://redis:6379/0
      CALL_PROVIDER: ${CALL_PROVIDER:-simulator}
      MAX_CONCURRENT_CALLS: ${MAX_CONCURRENT_CALLS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      THREECX_BASE_URL: ${THREECX_BASE_URL:-}
      THREECX_APP_ID: ${THREECX_APP_ID:-}
      THREECX_API_KEY: ${THREECX_API_KEY:-}
      THREECX_CONTROL_EXTENSION: ${THREECX_CONTROL_EXTENSION:-}
      THREECX_TEST_DESTINATION: ${THREECX_TEST_DESTINATION:-}
      THREECX_TEST_CALL_TIMEOUT_SECONDS: ${THREECX_TEST_CALL_TIMEOUT_SECONDS:-45}
      THREECX_TEST_FORWARD_DESTINATION: ${THREECX_TEST_FORWARD_DESTINATION:-}
      THREECX_TEST_FIRST_DESTINATION: ${THREECX_TEST_FIRST_DESTINATION:-}
      THREECX_TEST_FORWARD_WAIT_SECONDS: ${THREECX_TEST_FORWARD_WAIT_SECONDS:-25}
      THREECX_TEST_HOLD_WAIT_SECONDS: ${THREECX_TEST_HOLD_WAIT_SECONDS:-45}
      TRANSFER_MESSAGE_PATH: ${TRANSFER_MESSAGE_PATH:-}
      PRERECORDED_MESSAGE_PATH: ${PRERECORDED_MESSAGE_PATH:-/app/media/test-message.mp3}
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-/app/media/uploads}
      MAX_AUDIO_UPLOAD_BYTES: ${MAX_AUDIO_UPLOAD_BYTES:-26214400}
      TRANSCRIPT_SYNC_ENABLED: ${TRANSCRIPT_SYNC_ENABLED:-true}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      # The operator's one controlled test message is mounted as a single
      # read-only file. Browser uploads live in a separate local Docker
      # volume, never in PostgreSQL or Git. Do not mount the parent
      # /app/media directory read-only: Docker cannot mount this writable
      # child volume beneath a read-only bind mount.
      - ./media/test-message.mp3:/app/media/test-message.mp3:ro
      - audio_uploads:/app/media/uploads
      - whisper_cache:/app/.cache
    ports:
      # Bind only to loopback; put a TLS reverse proxy in front of this service.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  audio_uploads:
  whisper_cache:
